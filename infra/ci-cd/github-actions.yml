# INERT UNTIL CONFIGURED — this workflow does nothing against real AWS
# until the following are ALL in place, and it must not be enabled before
# explicit infrastructure approval:
#   1. The staging environment is approved and provisioned (infra/terraform).
#   2. The GitHub secrets below are configured (AWS_ROLE_TO_ASSUME must be
#      an IAM role with ECR push + ECS deploy permissions, trusted by
#      GitHub's OIDC provider — no long-lived AWS keys).
#   3. A Dockerfile exists at the repo root and the ECR repository exists.
# Until then, only the pull_request job (lint + tests) is safe to run.
#
# Required GitHub secrets / variables:
#   AWS_ROLE_TO_ASSUME  - IAM role ARN for OIDC (secrets)
#   AWS_REGION          - e.g. us-east-1 (vars or secrets)
#   ECR_REPOSITORY      - ECR repository name, e.g. null-itsm-staging-api (vars)
#   ECS_CLUSTER         - ECS cluster name (vars)
#   ECS_SERVICE_API     - ECS API service name (vars)
#   ECS_SERVICE_WORKER  - ECS worker service name (vars)
#   ECS_TASK_DEF_API    - ECS API task definition family (vars)
#   ECS_TASK_DEF_WORKER - ECS worker task definition family (vars)

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for OIDC role assumption with AWS

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  # Runs on every pull request (and on push to main, before deploy).
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

  # Runs only on push to main, after tests pass. Builds the image, pushes
  # it to ECR, and deploys it to both ECS services.
  deploy:
    name: Build, push, and deploy to staging
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # The task definitions are managed by Terraform; the workflow only
      # swaps in the newly built image and deploys the updated definition.
      - name: Download current API task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEF_API }}" \
            --query taskDefinition > task-definition-api.json

      - name: Render API task definition with new image
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-api.json
          container-name: api
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_API }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Download current worker task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEF_WORKER }}" \
            --query taskDefinition > task-definition-worker.json

      - name: Render worker task definition with new image
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-worker.json
          container-name: worker
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_WORKER }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
