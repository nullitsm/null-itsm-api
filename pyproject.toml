[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "null-itsm-api"
version = "0.1.0"
description = "NULL ITSM — multi-tenant enterprise ITSM platform API (modular monolith, FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.0",
    "PyJWT>=2.10",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "slowapi>=0.1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
